<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Silva Reads"><meta name="description" content="Silva 的英文故事书架，支持离线阅读、单词释义与进度保存。"><title>Silva Reads · 英文阅读</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"></head>
<body><header><button class="brand" id="home" aria-label="回到书架"><span class="brand-mark">S</span><span>Silva <i>Reads</i></span></button><div class="header-actions"><span id="offline" role="status">正在准备故事…</span><button id="reading-records" class="quiet" onclick="showReadingRecords()">阅读记录</button><button id="speech-settings" class="quiet" onclick="showSpeechSettings()">朗读设置</button><button id="parents" class="quiet">阅读备份</button></div></header><main id="app" aria-live="polite"></main>
<dialog id="word-dialog"><button class="dialog-close" aria-label="关闭">×</button><span class="eyebrow">WORD HELPER</span><h2 id="word-title"></h2><p id="meaning"></p><div class="dialog-actions"><button id="say-word">听读音</button><button id="save-word" class="quiet">加入生词本</button></div></dialog>
<dialog id="speech-dialog"><button class="dialog-close" aria-label="关闭">×</button><h2>朗读设置</h2><div id="speech-settings-content"></div></dialog><dialog id="parent-dialog"><button class="dialog-close" aria-label="关闭">×</button><h2>阅读备份</h2><p>保存或恢复这台设备上的阅读进度、笔记和生词本。</p><div class="dialog-actions"><button id="backup" class="quiet">导出阅读备份</button><label class="file-button">恢复备份<input id="restore" type="file" accept="application/json,.json"></label></div><p class="help">iPad：在 Safari 打开本工具，等待提示“故事已保存，可离线阅读”，再用分享菜单“添加到主屏幕”。首次添加后打开一次，确认离线提示再断网。自带图书采用美式童声 Ana，音频保存后可离线朗读；单词点读和自建故事使用设备英语语音。进度保存在当前设备，清除网站数据会删除记录，请定期备份。</p><p id="parent-message" role="status"></p></dialog><dialog id="note-dialog"><button class="dialog-close" aria-label="关闭">×</button><h2 id="note-heading">我的笔记</h2><label>写下你的想法<textarea id="note-body" rows="6" maxlength="2000" placeholder="喜欢哪一句？学到了什么？"></textarea></label><button id="save-note" onclick="savePageNote()">保存笔记</button><p id="note-message"></p></dialog><dialog id="record-dialog"><button class="dialog-close" aria-label="关闭">×</button><h2>阅读记录与笔记</h2><div id="record-content"></div></dialog><div id="toast" role="status"></div><script src="page-audio.js"></script><script src="picture.js"></script><script src="app.js"></script></body></html>
