<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Silva Reads"><meta name="description" content="Silva 的英文故事书架，支持离线阅读、单词释义与进度保存。"><title>Silva Reads · 英文阅读</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"></head>
<body><header><button class="brand" id="home" aria-label="回到书架"><span class="brand-mark">S</span><span>Silva <i>Reads</i></span></button><div class="header-actions"><span id="offline" role="status">正在准备故事…</span><button id="parents" class="quiet">家长</button></div></header><main id="app" aria-live="polite"></main>
<dialog id="word-dialog"><button class="dialog-close" aria-label="关闭">×</button><span class="eyebrow">WORD HELPER</span><h2 id="word-title"></h2><p id="meaning"></p><div class="dialog-actions"><button id="say-word">听读音</button><button id="save-word" class="quiet">加入生词本</button></div></dialog>
<dialog id="parent-dialog"><button class="dialog-close" aria-label="关闭">×</button><span class="eyebrow">FOR PARENTS</span><h2>管理阅读内容</h2><p>自带 10 篇 Minecraft 故事。也可以粘贴一篇英文短文，保存在这台设备上。</p><label>故事标题<input id="new-title" maxlength="100" placeholder="My next adventure"></label><label>英文正文<textarea id="new-body" rows="5" placeholder="用空行分隔段落"></textarea></label><button id="import-story">添加到书架</button><hr><div class="dialog-actions"><button id="backup" class="quiet">导出阅读备份</button><label class="file-button">恢复备份<input id="restore" type="file" accept="application/json,.json"></label></div><p class="help">iPad：在 Safari 打开本工具，等待提示“故事已保存，可离线阅读”，再用分享菜单“添加到主屏幕”。首次添加后打开一次，确认离线提示再断网。朗读需要设备上可用的英语语音。进度保存在当前设备，清除网站数据会删除记录，请定期备份。</p><p id="parent-message" role="status"></p></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
